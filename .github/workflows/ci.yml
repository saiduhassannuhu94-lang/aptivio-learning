name: APTIVIO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aptivio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Synchronize dependency lockfile
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize npm lockfile
        timeout-minutes: 5
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps --fetch-retries=1 --fetch-timeout=60000 --loglevel=notice

      - name: Commit synchronized lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: synchronize npm dependency lockfile"
            git push
          fi

  quality:
    name: Lint, typecheck, test, audit, build
    needs: lockfile
    if: ${{ always() && (needs.lockfile.result == 'success' || needs.lockfile.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile for pull request validation
        if: ${{ github.event_name == 'pull_request' }}
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps --fetch-retries=1 --fetch-timeout=60000 --loglevel=notice

      - name: Verify dependency lockfile
        run: test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Validate course content packages
        run: npm run validate:courses
      - name: Dry-run Batch 1 course import
        run: npm run import:courses

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production application
        run: npm run build
